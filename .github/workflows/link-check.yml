name: Check links

on:
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # Substack blocks automated checkers with 403, so its links are skipped here.
          args: --no-progress --exclude-path site --exclude 'substack\.com' './**/*.md'
          fail: true
